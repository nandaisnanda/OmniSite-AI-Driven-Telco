[theme]
base = "dark"
primaryColor = "#00D2FF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#141922"
textColor = "#F2F6FA"
font = "sans serif"

[client]
toolbarMode = "minimal"
# Tracebacks belong in the server log, not in the visitor's browser: they leak file
# paths, library versions and query internals. Override to "full" locally when debugging.
# TEMPORARY: surfaced to diagnose a Community Cloud startup crash that reproduces
# nowhere else. Revert to "type" the moment the cause is found — a public deployment
# must not serve tracebacks.
showErrorDetails = "full"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10
maxMessageSize = 20
enableXsrfProtection = true
headless = true

[runner]
fastReruns = true
magicEnabled = false

[logger]
level = "info"